[project]
name = "oer-hub"
version = "0.1.0"
description = "Кафедральный репозиторий образовательных ресурсов"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "python-dotenv>=1.0.1",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.28.0",
    "gunicorn>=23.0.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=4.4.6",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 79
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "migrations",
    ".venv",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
